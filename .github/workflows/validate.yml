name: Validate and package

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate plugin
        run: python3 tools/validate.py

      - name: Build Moodle package
        if: matrix.php == '8.3'
        run: python3 tools/package.py

      - name: Inspect package root
        if: matrix.php == '8.3'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          packages = list(Path('dist').glob('*.zip'))
          assert len(packages) == 1, packages
          with ZipFile(packages[0]) as archive:
              names = archive.namelist()
              assert names, 'empty package'
              assert all(name.startswith('aitutoria/') for name in names)
              assert 'aitutoria/version.php' in names
          print(packages[0])
          PY

      - name: Upload installable ZIP
        if: matrix.php == '8.3'
        uses: actions/upload-artifact@v4
        with:
          name: assignfeedback-aitutoria
          path: dist/*.zip
          if-no-files-found: error
